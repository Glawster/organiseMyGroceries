[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "groceries"
dynamic = ["version"]
description = "Shared grocery catalogue and shopping-list helper"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "organiseMyProjects",
    "playwright>=1.54,<2",
    "textual>=8.2,<9",
]

[project.scripts]
groceries = "organiseMyGroceries.main:main"

[project.optional-dependencies]
dev = [
    "black>=25.1,<26",
    "pre-commit>=4.2,<5",
    "pytest>=9,<10",
    "pytest-cov>=6,<7",
]

[tool.setuptools.packages.find]
include = ["organiseMyGroceries*"]

[tool.setuptools.dynamic]
version = {attr = "organiseMyGroceries.version.__version__"}

[tool.setuptools.package-data]
"organiseMyGroceries.ui" = ["*.tcss"]

[tool.black]
target-version = ["py310"]
