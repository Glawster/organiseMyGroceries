[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "groceries"
version = "0.1"
description = "Shared grocery catalogue and shopping-list helper"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "organiseMyProjects",
    "playwright>=1.54,<2",
]

[project.scripts]
groceries = "organiseMyGroceries.cli:main"

[project.optional-dependencies]
dev = [
    "black>=25.1,<26",
    "pre-commit>=4.2,<5",
    "pytest>=9,<10",
    "pytest-cov>=6,<7",
]

[tool.setuptools.packages.find]
include = ["organiseMyGroceries"]

[tool.black]
target-version = ["py310"]
