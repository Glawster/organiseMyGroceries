[pytest]
testpaths = tests
pythonpath = . src
python_files = test_[a-z]*.py
python_functions = test*
python_classes = Test*
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --cov=organiseMyGroceries
    --cov-branch
    --cov-report=term-missing
filterwarnings = 
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
